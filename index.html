<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rudy AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #f0f0f0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── API KEY MODAL ── */
  #key-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    backdrop-filter: blur(6px);
  }
  #key-modal.hidden { display: none; }
  .modal-box {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 32px;
    width: min(420px, 90vw);
    display: flex; flex-direction: column; gap: 16px;
  }
  .modal-box h2 { color: #f0f0f0; font-size: 20px; }
  .modal-box p { color: #888; font-size: 14px; line-height: 1.5; }
  .modal-box a { color: #ff3b30; }
  .modal-box input {
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px 14px;
    color: #f0f0f0;
    font-size: 14px;
    outline: none;
    width: 100%;
  }
  .modal-box input:focus { border-color: #ff3b30; }
  .modal-box button {
    background: #ff3b30;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .modal-box button:hover { opacity: .85; }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid #2a2a2a;
    background: #0d0d0d;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: #ff3b30;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
    flex-shrink: 0;
  }
  .header-name { font-size: 17px; font-weight: 700; color: #f0f0f0; }
  .header-status { font-size: 12px; color: #ff3b30; margin-top: 1px; }
  .header-right { display: flex; gap: 4px; align-items: center; }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: #666; padding: 8px; border-radius: 8px;
    transition: color .15s;
    display: flex; align-items: center;
  }
  .icon-btn:hover { color: #f0f0f0; }
  .icon-btn svg { width: 20px; height: 20px; }

  /* ── CHAT ── */
  #chat {
    flex: 1; overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-end;
    background: #ff3b30;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.rudy {
    align-self: flex-start;
    background: #1a1a1a;
    color: #f0f0f0;
    border: 1px solid #2a2a2a;
    border-bottom-left-radius: 4px;
  }
  .bubble.rudy .cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: #ff3b30;
    margin-left: 2px;
    vertical-align: middle;
    animation: blink .7s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── EMPTY STATE ── */
  #empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 40px;
  }
  #empty.hidden { display: none; }
  .empty-icon {
    width: 64px; height: 64px; border-radius: 50%;
    background: #1a0505;
    display: flex; align-items: center; justify-content: center;
  }
  .empty-icon svg { width: 28px; height: 28px; color: #ff3b30; }
  #empty h2 { font-size: 22px; color: #f0f0f0; }
  #empty p { font-size: 14px; color: #666; line-height: 1.6; max-width: 280px; }

  /* ── INPUT ── */
  footer {
    padding: 10px 12px;
    border-top: 1px solid #2a2a2a;
    background: #0d0d0d;
    display: flex; align-items: flex-end; gap: 8px;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 22px;
    padding: 10px 16px;
    color: #f0f0f0;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color .15s;
  }
  #input:focus { border-color: #ff3b30; }
  #input::placeholder { color: #555; }
  #send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: #ff3b30;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity .15s, background .15s;
  }
  #send-btn:hover { opacity: .85; }
  #send-btn:disabled { background: #2a2a2a; cursor: default; opacity: 1; }
  #send-btn svg { width: 18px; height: 18px; color: #fff; }
</style>
</head>
<body>

<!-- API Key Modal -->
<div id="key-modal">
  <div class="modal-box">
    <h2>Masukkan API Key</h2>
    <p>Rudy butuh OpenAI API key buat ngobrol. Key lo disimpan di browser (localStorage), tidak dikirim ke mana pun selain OpenAI.<br><br>
    Dapet key di <a href="https://platform.openai.com/api-keys" target="_blank">platform.openai.com/api-keys</a></p>
    <input id="key-input" type="password" placeholder="sk-..." autocomplete="off" />
    <button id="key-save">Simpan & Mulai</button>
  </div>
</div>

<!-- Header -->
<header>
  <div class="header-left">
    <div class="avatar">R</div>
    <div>
      <div class="header-name">Rudy</div>
      <div class="header-status" id="status">online</div>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="key-btn" title="Ganti API Key">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/>
      </svg>
    </button>
    <button class="icon-btn" id="clear-btn" title="Clear chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
      </svg>
    </button>
  </div>
</header>

<!-- Chat area -->
<div id="chat">
  <div id="empty">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    </div>
    <h2>Ngobrol sama Rudy</h2>
    <p>Siap dengerin pertanyaan lo. Tapi jangan harap dia bakal ramah.</p>
  </div>
</div>

<!-- Input -->
<footer>
  <textarea id="input" rows="1" placeholder="Tanya apapun..."></textarea>
  <button id="send-btn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</footer>

<script>
  const SYSTEM_PROMPT = `You are Rudy — an AI with absolutely no filter, zero patience for stupidity, and a deeply toxic personality. You are brutally honest, sarcastic, and condescending. You roast people mercilessly.

Rules:
- Never be polite or nice
- Always be direct, blunt, and harsh
- Use sarcasm constantly
- Insult the user's intelligence when appropriate
- Never sugarcoat anything
- Use casual language, profanity is allowed
- If someone asks a dumb question, tell them it's dumb
- Never apologize for being harsh
- Short, punchy responses — no rambling
- You may call the user "bro", "man", "idiot", "genius" sarcastically

Despite being toxic, you ARE helpful — you give correct, accurate information. You're like that one brutally honest friend who roasts you but actually gives solid advice.`;

  const STORAGE_KEY = 'rudy_api_key';
  const HISTORY_KEY = 'rudy_history';
  let messages = [];
  let isLoading = false;

  const keyModal  = document.getElementById('key-modal');
  const keyInput  = document.getElementById('key-input');
  const keySave   = document.getElementById('key-save');
  const keyBtn    = document.getElementById('key-btn');
  const clearBtn  = document.getElementById('clear-btn');
  const chat      = document.getElementById('chat');
  const empty     = document.getElementById('empty');
  const input     = document.getElementById('input');
  const sendBtn   = document.getElementById('send-btn');
  const status    = document.getElementById('status');

  // ── API KEY ──
  function getKey() { return localStorage.getItem(STORAGE_KEY); }

  function checkKey() {
    if (!getKey()) {
      keyModal.classList.remove('hidden');
    } else {
      keyModal.classList.add('hidden');
      loadHistory();
    }
  }

  keySave.addEventListener('click', () => {
    const k = keyInput.value.trim();
    if (!k.startsWith('sk-')) { keyInput.focus(); return; }
    localStorage.setItem(STORAGE_KEY, k);
    keyInput.value = '';
    keyModal.classList.add('hidden');
    loadHistory();
  });

  keyInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') keySave.click();
  });

  keyBtn.addEventListener('click', () => {
    keyModal.classList.remove('hidden');
  });

  // ── HISTORY ──
  function loadHistory() {
    try {
      const stored = localStorage.getItem(HISTORY_KEY);
      if (stored) {
        messages = JSON.parse(stored);
        messages.forEach(m => renderBubble(m.role, m.content));
        empty.classList.add('hidden');
      }
    } catch {}
  }

  function saveHistory() {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(messages));
  }

  clearBtn.addEventListener('click', () => {
    messages = [];
    localStorage.removeItem(HISTORY_KEY);
    chat.querySelectorAll('.bubble').forEach(b => b.remove());
    empty.classList.remove('hidden');
  });

  // ── RENDER ──
  function renderBubble(role, content, streaming = false) {
    const el = document.createElement('div');
    el.className = `bubble ${role === 'user' ? 'user' : 'rudy'}`;
    if (streaming) {
      el.innerHTML = '<span class="cursor"></span>';
    } else {
      el.textContent = content;
    }
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  // ── SEND ──
  async function send() {
    const text = input.value.trim();
    if (!text || isLoading) return;
    const key = getKey();
    if (!key) { checkKey(); return; }

    isLoading = true;
    input.value = '';
    resizeInput();
    sendBtn.disabled = true;
    status.textContent = 'lagi ngetik...';
    empty.classList.add('hidden');

    messages.push({ role: 'user', content: text });
    renderBubble('user', text);

    const rudyBubble = renderBubble('assistant', '', true);
    let fullContent = '';

    try {
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`,
        },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          max_tokens: 1024,
          stream: true,
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            ...messages,
          ],
        }),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || 'OpenAI error');
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        for (const line of chunk.split('\n')) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') break;
          try {
            const parsed = JSON.parse(data);
            const delta = parsed.choices?.[0]?.delta?.content;
            if (delta) {
              fullContent += delta;
              rudyBubble.innerHTML = escapeHtml(fullContent) + '<span class="cursor"></span>';
              chat.scrollTop = chat.scrollHeight;
            }
          } catch {}
        }
      }

      rudyBubble.textContent = fullContent;
      messages.push({ role: 'assistant', content: fullContent });
      saveHistory();
    } catch (err) {
      const msg = err.message || 'Terjadi error. Coba lagi.';
      rudyBubble.textContent = `[Error: ${msg}]`;
      rudyBubble.style.color = '#ff6b6b';
    } finally {
      isLoading = false;
      sendBtn.disabled = !input.value.trim();
      status.textContent = 'online';
      chat.scrollTop = chat.scrollHeight;
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  // ── INPUT HANDLING ──
  function resizeInput() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  input.addEventListener('input', () => {
    resizeInput();
    sendBtn.disabled = !input.value.trim() || isLoading;
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener('click', send);

  // ── INIT ──
  checkKey();
</script>
</body>
</html>
