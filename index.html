<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Kecepatan Mengetik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
        }

        .stat-box {
            font-size: 1.1rem;
        }

        .stat-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: #2980b9;
        }

        #text-display {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
            background: #fdfefe;
            padding: 15px;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            user-select: none;
            letter-spacing: 0.5px;
        }

        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; background-color: #f9d5d5; }
        .current { border-bottom: 2px solid #2980b9; }

        #typing-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
        }

        #typing-input:focus {
            border-color: #2980b9;
        }

        #btn-reset {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #btn-reset:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Tes Kecepatan Mengetik</h1>
    
    <div class="stats-container">
        <div class="stat-box">Waktu: <span id="timer">60</span>s</div>
        <div class="stat-box">WPM: <span id="wpm">0</span></div>
        <div class="stat-box">Akurasi: <span id="accuracy">100</span>%</div>
    </div>

    <div id="text-display">Memuat teks...</div>
    
    <textarea id="typing-input" rows="3" placeholder="Mulai mengetik di sini untuk memulai tes..."></textarea>
    
    <button id="btn-reset">Mulai Ulang / Teks Baru</button>
</div>

<script>
    // Kumpulan paragraf teks untuk dites (tidak cuma satu atau dua)
    const paragraphs = [
        "Teknologi informasi berkembang dengan sangat pesat di era digital saat ini. Setiap orang dituntut untuk bisa beradaptasi dengan perubahan yang ada agar tidak tertinggal jauh.",
        "Kunci utama dari kemampuan mengetik cepat adalah konsistensi dan posisi jari yang benar pada papan ketik. Latihan yang rutin akan membentuk memori otot secara alami.",
        "Matahari terbit dari ufuk timur membawa kehangatan di pagi hari yang cerah. Burung-burung berkicau riang menyambut datangnya lembaran hari yang baru penuh harapan.",
        "Belajar pemrograman komputer membutuhkan logika yang kuat dan kesabaran tingkat tinggi. Masalah atau kutu dalam kode adalah hal biasa yang harus diselesaikan dengan tenang.",
        "Kesehatan adalah aset paling berharga yang dimiliki oleh manusia. Menjaga pola makan yang seimbang dan berolahraga secara teratur adalah investasi jangka panjang yang terbaik.",
        "Hutan hujan tropis memiliki keanekaragaman hayati yang sangat kaya. Banyak spesies flora dan fauna langka yang menggantungkan hidupnya pada kelestarian ekosistem hutan ini."
    ];

    let timer = 60;
    let maxTime = 60;
    let timeLeft = maxTime;
    let timeElapsed = 0;
    let timerInterval = null;
    let isTypingStarted = false;
    
    let currentParagraph = "";
    let totalCharactersTyped = 0;
    let errors = 0;

    const textDisplay = document.getElementById('text-display');
    const typingInput = document.getElementById('typing-input');
    const timerEl = document.getElementById('timer');
    const wpmEl = document.getElementById('wpm');
    const accuracyEl = document.getElementById('accuracy');
    const btnReset = document.getElementById('btn-reset');

    // Inisialisasi game
    function initTest() {
        clearInterval(timerInterval);
        timeLeft = maxTime;
        timeElapsed = 0;
        errors = 0;
        totalCharactersTyped = 0;
        isTypingStarted = false;
        
        timerEl.innerText = timeLeft;
        wpmEl.innerText = 0;
        accuracyEl.innerText = 100;
        typingInput.value = "";
        typingInput.disabled = false;

        // Ambil paragraf acak
        const randomIndex = Math.floor(Math.random() * paragraphs.length);
        currentParagraph = paragraphs[randomIndex];
        
        // Bungkus setiap karakter dengan tag span untuk efek warna nanti
        textDisplay.innerHTML = "";
        currentParagraph.split("").forEach(char => {
            const span = document.createElement('span');
            span.innerText = char;
            textDisplay.appendChild(span);
        });
        
        // Tandai karakter pertama
        if(textDisplay.children.length > 0) {
            textDisplay.children[0].classList.add('current');
        }
    }

    // Fungsi Timer
    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                timeElapsed++;
                timerEl.innerText = timeLeft;
                
                // Hitung WPM real-time
                let wpm = Math.round(((totalCharactersTyped / 5) / timeElapsed) * 60);
                wpmEl.innerText = wpm < 0 || !wpm || wpm === Infinity ? 0 : wpm;
            } else {
                endTest();
            }
        }, 1000);
    }

    // Logika ketika mengetik
    typingInput.addEventListener('input', () => {
        const charactersSpans = textDisplay.querySelectorAll('span');
        const inputValue = typingInput.value.split('');
        
        if (!isTypingStarted) {
            startTimer();
            isTypingStarted = true;
        }

        errors = 0;
        totalCharactersTyped = inputValue.length;

        charactersSpans.forEach((charSpan, index) => {
            const typedChar = inputValue[index];
            
            // Hapus kelas penanda posisi saat ini
            charSpan.classList.remove('current');

            if (typedChar == null) {
                // Belum diketik
                charSpan.classList.remove('correct', 'incorrect');
            } else if (typedChar === charSpan.innerText) {
                // Ketikan benar
                charSpan.classList.add('correct');
                charSpan.classList.remove('incorrect');
            } else {
                // Ketikan salah
                charSpan.classList.add('incorrect');
                charSpan.classList.remove('correct');
                errors++;
            }
        });

        // Kasih penanda bawah (underline) di karakter yang harus diketik selanjutnya
        if (inputValue.length < charactersSpans.length) {
            charactersSpans[inputValue.length].classList.add('current');
        }

        // Hitung Akurasi
        let accuracy = 0;
        if (totalCharactersTyped > 0) {
            accuracy = Math.round(((totalCharactersTyped - errors) / totalCharactersTyped) * 100);
        }
        accuracyEl.innerText = accuracy < 0 ? 0 : accuracy;

        // Jika teks sudah selesai diketik semua sebelum waktu habis
        if (inputValue.length === charactersSpans.length) {
            endTest();
        }
    });

    function endTest() {
        clearInterval(timerInterval);
        typingInput.disabled = true;
        
        // Final WPM Score
        let finalWpm = Math.round(((totalCharactersTyped / 5) / (timeElapsed || 1)) * 60);
        wpmEl.innerText = finalWpm;
        
        alert(`Tes Selesai!\nKecepatan Anda: ${wpmEl.innerText} WPM\nAkurasi: ${accuracyEl.innerText}%`);
    }

    btnReset.addEventListener('click', initTest);

    // Jalankan pertama kali saat web dibuka
    window.onload = initTest;
</script>

</body>
</html>
