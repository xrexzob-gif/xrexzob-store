<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XREXZOB BOT HOST</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    height: 65px;
    background: #0d111a;
    border-bottom: 1px solid #252c39;
    display: flex;
    align-items: center;
    padding: 0 20px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.logo span {
    color: #5865f2;
}

.container {
    width: 92%;
    max-width: 900px;
    margin: 30px auto;
}

.card {
    background: #0e131d;
    border: 1px solid #252c39;
    border-radius: 16px;
    padding: 20px;
}

h1 {
    font-size: 25px;
    margin-bottom: 7px;
}

.desc {
    color: #8993a5;
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    height: 400px;
    resize: vertical;
    background: #05070b;
    color: #d7e0ef;
    border: 1px solid #293141;
    border-radius: 12px;
    padding: 15px;
    outline: none;
    font-family: monospace;
    font-size: 13px;
}

textarea:focus {
    border-color: #5865f2;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-weight: bold;
    cursor: pointer;
}

.run {
    background: #5865f2;
    color: white;
}

.stop {
    background: #292f3a;
    color: white;
}

.status {
    margin-top: 20px;
    padding: 15px;
    background: #080c13;
    border: 1px solid #252c39;
    border-radius: 10px;
}

.status-label {
    color: #8993a5;
    font-size: 12px;
    margin-bottom: 7px;
}

#status {
    color: #ffb84d;
    font-weight: bold;
}

.console {
    margin-top: 15px;
    background: #05070b;
    border: 1px solid #252c39;
    border-radius: 10px;
    padding: 15px;
    min-height: 130px;
    color: #7ee787;
    font-family: monospace;
    font-size: 13px;
    white-space: pre-wrap;
}

.footer {
    text-align: center;
    color: #555f70;
    font-size: 12px;
    margin: 25px;
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <span>SHAREJOB</span> — XREXZOB BOT HOST
    </div>
</header>

<div class="container">

<div class="card">

<h1>🐍 Python Bot Host</h1>

<p class="desc">
Tempel script Python Discord kamu lalu jalankan bot.
</p>

<textarea id="code" placeholder="Tempel kode Python discord.py kamu di sini..."></textarea>

<div class="buttons">
    <button class="run" onclick="runBot()">▶ RUN BOT</button>
    <button class="stop" onclick="stopBot()">■ STOP</button>
</div>

<div class="status">
    <div class="status-label">STATUS</div>
    <div id="status">● OFFLINE</div>
</div>

<div class="console" id="console">
XREXZOB BOT HOST
> Menunggu perintah...
</div>

</div>
</div>

<div class="footer">
SHAREJOB • XREXZOB BOT HOST
</div>

<script>

const BACKEND_URL = "https://MASUKKAN-URL-BACKEND-KAMU";

async function runBot() {

    const code = document.getElementById("code").value;
    const status = document.getElementById("status");
    const consoleBox = document.getElementById("console");

    if (!code.trim()) {
        consoleBox.textContent +=
        "\n> ❌ Script Python masih kosong.";
        return;
    }

    status.textContent = "● STARTING...";
    status.style.color = "#ffb84d";

    consoleBox.textContent +=
    "\n> Menghubungkan ke backend...";

    try {

        const response = await fetch(
            BACKEND_URL + "/run",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    code: code
                })
            }
        );

        const result = await response.json();

        consoleBox.textContent +=
        "\n> " + result.message;

        if (result.success) {

            status.textContent = "● ONLINE";
            status.style.color = "#7ee787";

        } else {

            status.textContent = "● ERROR";
            status.style.color = "#ff6b6b";
        }

    } catch (error) {

        status.textContent = "● BACKEND OFFLINE";
        status.style.color = "#ff6b6b";

        consoleBox.textContent +=
        "\n> ❌ Tidak dapat terhubung ke backend.";
    }
}


async function stopBot() {

    const status = document.getElementById("status");
    const consoleBox = document.getElementById("console");

    try {

        const response = await fetch(
            BACKEND_URL + "/stop",
            {
                method: "POST"
            }
        );

        const result = await response.json();

        consoleBox.textContent +=
        "\n> " + result.message;

        status.textContent = "● OFFLINE";
        status.style.color = "#ff6b6b";

    } catch (error) {

        consoleBox.textContent +=
        "\n> ❌ Backend tidak terhubung.";
    }
}

</script>

</body>
</html>
