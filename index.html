<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta & Ad-Link Bypasser</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #2a2a2a;
        }
        h1 {
            color: #00ff87;
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #111;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00ff87;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #00cc6a;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #111;
            border-radius: 6px;
            border: 1px solid #333;
            display: none;
            word-break: break-all;
        }
        .result-title {
            color: #00ff87;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Delta Key Bypasser</h1>
    <p style="color: #aaa; font-size: 14px;">Tempel link checkpoint Delta atau ad-link lo di bawah ini:</p>
    
    <input type="text" id="targetLink" placeholder="https://gateway.platoboost.com/a/8?id=...">
    <button onclick="processBypass()">Bypass Link</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">Hasil Bypass:</div>
        <p id="resultText" style="margin: 5px 0;"></p>
    </div>
</div>

<script>
async function processBypass() {
    const inputUrl = document.getElementById('targetLink').value.trim();
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    if (!inputUrl) {
        alert('Harap masukkan link terlebih dahulu!');
        return;
    }

    resultBox.style.display = 'block';
    resultText.innerHTML = '<span style="color: #ffaa00;">Sedang memproses, mohon tunggu...</span>';

    try {
        // Menggunakan penyedia API pihak ketiga gratisan yang mendukung bypass platoboost/adlink
        // Catatan: Endpoint API eksternal ini bisa berubah sewaktu-waktu tergantung penyedia jasanya
        const apiUrl = `https://api.bypass.vip/bypass?url=${encodeURIComponent(inputUrl)}`;
        
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data && data.status === "success" && data.result) {
            resultText.innerHTML = `<a href="${data.result}" target="_blank" style="color: #00ff87; text-decoration: none;">${data.result}</a>`;
        } else if (data && data.destination) {
            resultText.innerHTML = `<a href="${data.destination}" target="_blank" style="color: #00ff87; text-decoration: none;">${data.destination}</a>`;
        } else {
            resultText.innerHTML = '<span style="color: #ff3333;">Gagal mengekstrak link. Pastikan link yang dimasukkan valid atau coba lagi nanti.</span>';
        }
    } catch (error) {
        console.error(error);
        resultText.innerHTML = '<span style="color: #ff3333;">Terjadi kesalahan koneksi ke server bypasser.</span>';
    }
}
</script>

</body>
</html>
